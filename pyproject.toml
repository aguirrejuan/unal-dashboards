[project]
name = "pic-etl"
version = "0.1.0"
description = "Extraction and load pipeline for the PIC documentary corpus"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.scripts]
pic-etl = "pic_etl.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = [
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pic_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
