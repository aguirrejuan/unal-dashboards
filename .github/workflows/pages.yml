name: Publicar el tablero

# The point of this workflow is the gate, not the deploy: `verify` re-reads every
# figure from the original .docx and .xlsx and compares it against the database.
# If a transcription has drifted, or an invariant fails, the public site does not
# go out.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The twelve Acuerdos are PDFs with a text layer, read with pdftotext.
      # The .doc reports need nothing extra: their tables are recovered from the
      # raw OLE stream, so no macOS-only converter is involved.
      - name: Instalar poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --extra dev

      # Never `extract` here. Extractions are reviewed by a person and committed;
      # regenerating them in CI would silently discard that review. Snapshots are
      # derived purely from the sources, so they are safe to rebuild.
      - name: Renderizar tablas fuente
        run: uv run pic-etl snapshots

      - name: Construir la base
        run: uv run pic-etl build

      - name: Verificar invariantes y re-transcripción
        run: uv run pic-etl verify

      - name: Generar el sitio
        run: uv run pic-etl publish

      # After publishing, so the tests that execute each page's script against
      # the real payload actually run here instead of skipping for want of site/.
      - name: Pruebas
        run: uv run pytest -q

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
