     grupo: SPN, departamento_id: NAR, municipio_id: NAR_TUMACO, valido_desde: 2023-01-01}

  # ------------------------------------------------------------------ BLOCKING
  # §10: FCV's grain and validity range is an open prerequisite. The reading
  # encoded here — a faculty inside Medellín, reported separately from 2025 —
  # is provisional and drives every Medellín subtotal. `valido_hasta` is what
  # keeps this a type-2 change rather than a retroactive rewrite of the 2023
  # grain; change the date here, not the facts.
  - {unidad_id: FCV, nombre: Facultad de Ciencias (reporte separado), tipo: FACULTAD,
     padre_id: MEDELLIN, sede_id: MEDELLIN, grupo: ANDINA,
     departamento_id: ANT, municipio_id: ANT_MEDELLIN,
     valido_desde: 2025-01-01, valido_hasta: null}
