# Academic units. Sedes are roots: each is its own sede and has no parent.
# UNAL_TOTAL is a sentinel *beside* the hierarchy, not above it — university
# figures are declared by a document, never summed up from sedes. That is what
# the presentation rule "never let the tool compute a grand total" means in the
# schema.

unidad_academica:
  - {unidad_id: UNAL_TOTAL, nombre: Universidad Nacional (agregado), tipo: UNIVERSIDAD,
     padre_id: null, sede_id: UNAL_TOTAL, grupo: null, valido_desde: 2023-01-01}

  # Sedes andinas
  - {unidad_id: BOGOTA,    nombre: Sede Bogotá,    tipo: SEDE, padre_id: null, sede_id: BOGOTA,
     grupo: ANDINA, departamento_id: DC, municipio_id: DC_BOGOTA, valido_desde: 2023-01-01}
  - {unidad_id: MEDELLIN,  nombre: Sede Medellín,  tipo: SEDE, padre_id: null, sede_id: MEDELLIN,
     grupo: ANDINA, departamento_id: ANT, municipio_id: ANT_MEDELLIN, valido_desde: 2023-01-01}
  - {unidad_id: MANIZALES, nombre: Sede Manizales, tipo: SEDE, padre_id: null, sede_id: MANIZALES,
     grupo: ANDINA, departamento_id: CAL, municipio_id: CAL_MANIZALES, valido_desde: 2023-01-01}
  - {unidad_id: PALMIRA,   nombre: Sede Palmira,   tipo: SEDE, padre_id: null, sede_id: PALMIRA,
     grupo: ANDINA, departamento_id: VAC, municipio_id: VAC_PALMIRA, valido_desde: 2023-01-01}
  - {unidad_id: LA_PAZ,    nombre: Sede de La Paz, tipo: SEDE, padre_id: null, sede_id: LA_PAZ,
     grupo: OTRA, departamento_id: CES, municipio_id: CES_LA_PAZ, valido_desde: 2023-01-01}

  # Sedes de Presencia Nacional
