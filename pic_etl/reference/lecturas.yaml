# Lo que los datos dicen, una vez cargados.
#
# El registro de hallazgos dice dónde el corpus se contradice. Esto es otra cosa:
# qué se ve cuando las cifras ya están juntas y se pueden restar. Un lector que
# recorre nueve gráficos no debería tener que sacar él las conclusiones.
#
# Cada lectura trae la consulta que produce su número, igual que un hallazgo trae
# la que lo demuestra. El texto lleva marcadores {0}, {1}… que se rellenan con las
# columnas de esa consulta, así que la frase no puede envejecer sin que la
# consulta cambie con ella. `verify` las ejecuta todas y una prueba compara cada
# resultado con el valor esperado: si el corpus crece y una lectura deja de ser
# cierta, la construcción falla en vez de publicar una afirmación caduca.

lectura:

- lectura_id: L1
  titulo: La fuga está en la matrícula, no en la oferta
  cuerpo: >-
    De {0} cupos comprometidos se ofertaron {1} y se admitieron {2}: el sistema
    cumple hasta ahí. Sólo se matricularon {3}. La caída entre admisión y
    matrícula es de {4} personas, el {5} % — la única pérdida grande de la
    cadena, y la que ningún documento explica.
  ancla: embudo
  consulta: >-
    SELECT
      max(CASE WHEN paso = 1 THEN valor END),
      max(CASE WHEN paso = 2 THEN valor END),
      max(CASE WHEN paso = 3 THEN valor END),
      max(CASE WHEN paso = 4 THEN valor END),
      max(CASE WHEN paso = 3 THEN valor END) - max(CASE WHEN paso = 4 THEN valor END),
      round((max(CASE WHEN paso = 3 THEN valor END)
             - max(CASE WHEN paso = 4 THEN valor END)) * 100.0
            / max(CASE WHEN paso = 3 THEN valor END), 1)
    FROM v_embudo

- lectura_id: L2
  titulo: Un ciclo pesa más que los tres siguientes juntos
  cuerpo: >-
    El PIC 2023 comprometió {0} cupos. Los ciclos 2024, 2025 y 2026 suman {1}
    entre los tres. Comparar sus gráficos lado a lado induce a error: el primero
    fue un compromiso plurianual, los otros son incrementos anuales.
  ancla: compromiso
  consulta: >-
    SELECT
      sum(CASE WHEN ciclo_id = 'PIC_CO_2023' THEN cupos ELSE 0 END),
      sum(CASE WHEN ciclo_id <> 'PIC_CO_2023' THEN cupos ELSE 0 END)
    FROM v_compromiso_ciclo

- lectura_id: L3
  titulo: El dinero se concentra en una vigencia
  cuerpo: >-
    La vigencia {0} reúne el {1} % de todo lo registrado. Es el año fiscal del
    giro, no el del ciclo: buena parte de ese dinero paga compromisos formulados
    en 2023 y 2024.
  ancla: dinero
  sin_formato: "0"
  consulta: >-
    SELECT vigencia,
           round(sum(monto) * 100.0 / (SELECT sum(monto) FROM v_dinero_fuente), 1)
    FROM v_dinero_fuente GROUP BY vigencia ORDER BY sum(monto) DESC LIMIT 1

- lectura_id: L4
  titulo: Un cuartil de prioridad no aparece en ningún documento
  cuerpo: >-
    El índice de prioridad territorial parte los municipios en cuatro bandas.
    Sólo {0} tienen estudiantes; la banda {1} no aparece en ninguna cifra del
    corpus. No es un cero medido: es una ausencia, y se ve distinto.
  ancla: cuartil
  consulta: >-
    SELECT (SELECT count(DISTINCT cuartil_id) FROM cobertura_territorial),
           (SELECT notacion FROM cuartil_prioridad
            WHERE cuartil_id NOT IN (SELECT cuartil_id FROM cobertura_territorial)
            LIMIT 1)

- lectura_id: L5
  titulo: Dos documentos sostienen tres de cada cuatro cifras
  cuerpo: >-
    El Anexo 1 y el Informe al MEN aportan {0} de las {1} cifras del corpus, el
    {2} %. Los otros dieciocho documentos aportan el resto. Cualquier error de
    transcripción en esos dos se propaga a casi todo el tablero.
  ancla: corpus
  consulta: >-
    SELECT
      (SELECT sum(cifras) FROM v_corpus
       WHERE documento_id IN ('ANEXO1_PIC', 'INFORME_MEN_2024_2025')),
      (SELECT count(*) FROM v_procedencia),
      round((SELECT sum(cifras) FROM v_corpus
             WHERE documento_id IN ('ANEXO1_PIC', 'INFORME_MEN_2024_2025'))
            * 100.0 / (SELECT count(*) FROM v_procedencia), 1)

- lectura_id: L6
  titulo: Las dos etapas sin respaldo son las que dirimirían
  cuerpo: >-
    De diez etapas del proceso, {0} tienen cifras que las respalden. Las {1} que
    no —revisión en mesa técnica y control— son precisamente las instancias que
    resolverían las {2} divergencias del registro.
  ancla: proceso.html
  consulta: >-
    SELECT (SELECT count(*) FROM v_etapas WHERE cifras > 0),
           (SELECT count(*) FROM v_etapas WHERE cifras = 0),
           (SELECT count(*) FROM hallazgo WHERE clase = 'DIVERGENCIA')
