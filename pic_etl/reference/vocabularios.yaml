# There is no global "correct" value. UNAL's reading and MEN's are both held,
# complete and internally consistent, and rendered side by side.
vista:
  - {vista_id: UNAL,    nombre: Lectura de la Universidad Nacional}
  - {vista_id: MEN,     nombre: Lectura del Ministerio}
  - {vista_id: AUDITOR, nombre: Lectura de control}

etapa:
  - {etapa_id: E01_ASIGNACION,   nombre: Asignación,               orden: 1,  actor: MEN + MinHacienda DGPPN}
  - {etapa_id: E02_EJECUCION_PPTAL, nombre: Ejecución presupuestal, orden: 2,  actor: MinHacienda / UNAL}
  - {etapa_id: E03_FORMULACION,  nombre: Formulación,              orden: 3,  actor: UNAL → MEN}
  - {etapa_id: E04_REVISION,     nombre: Revisión · mesa técnica,   orden: 4,  actor: MEN ↔ UNAL}
  - {etapa_id: E05_AUTORIZACION, nombre: Autorización interna,      orden: 5,  actor: CNF → CNCA → CSU}
  - {etapa_id: E06_CONVOCATORIA, nombre: Convocatoria,              orden: 6,  actor: DNA + sedes}
  - {etapa_id: E07_VINCULACION,  nombre: Vinculación docente,       orden: 7,  actor: sedes}
  - {etapa_id: E08_MATRICULA,    nombre: Matrícula,                 orden: 8,  actor: sedes}
  - {etapa_id: E09_REPORTE,      nombre: Reporte,                   orden: 9,  actor: UNAL → MEN}
  - {etapa_id: E10_CONTROL,      nombre: Control,                   orden: 10, actor: Contraloría / supervisión}
