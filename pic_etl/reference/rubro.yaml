# Spending lines, in two generations that nobody has bridged.
#
# V7: the corpus uses two rubro vocabularies with no crosswalk between them, and
# a third for Área del Conocimiento. `rubro_mapping` is therefore **empty** and
# stays empty until someone curates it. Under I10 that makes a cross-generation
# query return nothing, which is the correct answer — an empty result is honest;
# a joined one would be invented.

