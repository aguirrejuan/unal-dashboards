    no existe en lugar de valer 0.
  impacto: ALTO
  documento_id: ANEXO2_PIC
  ubicacion: Registro_Proyectos_2025!N18:T18
  estado: VERIFICADO
  verificacion: >-
    SELECT count(*) AS filas_de_financiacion_la_paz FROM asignacion
    WHERE unidad_id = 'LA_PAZ'

- hallazgo_id: V3
  clase: VACIO
  titulo: Cinco columnas del Anexo 2 están vacías en las nueve filas
  detalle: >-
    C (justificación), J (cantidad), K (unidad de medida), U (riesgos) y V
    (observaciones). v1 sólo listaba la sub-línea.
  impacto: MEDIO
  documento_id: ANEXO2_PIC
  ubicacion: Registro_Proyectos_2025!C,J,K,U,V
  estado: VERIFICADO
  verificacion: >-
    SELECT count(*) AS proyectos_sin_sublinea FROM proyecto WHERE sublinea_id IS NULL

- hallazgo_id: V4
  clase: VACIO
  titulo: La banda de cuartil (0.586,0.649] no aparece nunca
  detalle: >-
    Existe en el esquema y no tiene hechos. Un LEFT JOIN la pintaría igual que
    un cero medido, por eso la columna observado.
  impacto: MEDIO
  estado: VERIFICADO
  verificacion: >-
    SELECT q.cuartil_id, q.notacion, q.observado, count(c.estudiantes) AS hechos
    FROM cuartil_prioridad q
    LEFT JOIN cobertura_territorial c ON c.cuartil_id = q.cuartil_id
    GROUP BY q.cuartil_id

- hallazgo_id: V5
  clase: VACIO
  titulo: Tres columnas de fuente de financiación están vacías
  detalle: >-
    Derechos de matrícula (Q), recursos propios (R) y otras fuentes (S) no
    tienen valor en ninguna fila.
  impacto: MEDIO
  documento_id: ANEXO2_PIC
  ubicacion: Registro_Proyectos_2025!Q,R,S
  estado: VERIFICADO
  verificacion: >-
    SELECT f.fuente_id, f.columna_xlsx, count(a.asignacion_id) AS filas
    FROM fuente_financiacion f
    LEFT JOIN asignacion a ON a.fuente_id = f.fuente_id
    GROUP BY f.fuente_id ORDER BY f.columna_xlsx

- hallazgo_id: V6
  clase: VACIO
  titulo: Las etapas E03, E04 y E06 a E08 no tienen evidencia documental
  detalle: >-
    Formulación, revisión, convocatoria, vinculación y matrícula: el corpus no
    documenta ninguna. La tabla proyecto_etapa está vacía.
  impacto: ALTO
  estado: VERIFICADO
  verificacion: >-
    SELECT e.etapa_id, e.nombre, count(pe.proyecto_id) AS eventos
    FROM etapa e LEFT JOIN proyecto_etapa pe ON pe.etapa_id = e.etapa_id
    GROUP BY e.etapa_id ORDER BY e.orden

- hallazgo_id: V7
  clase: VACIO
  titulo: Dos generaciones de rubros sin puente entre ellas
  detalle: >-
    Y una tercera sin puentear, «Área del Conocimiento», con 8 categorías
    heredadas frente a 11 ISCED. rubro_mapping está vacío a propósito: sin
    puente, una consulta entre generaciones no devuelve nada, que es la
    respuesta correcta.
  impacto: ALTO
  estado: VERIFICADO
  verificacion: >-
    SELECT generacion, count(*) AS rubros FROM rubro GROUP BY generacion

- hallazgo_id: V8
  clase: VACIO
  titulo: La Tabla 14 nunca dice qué línea PIC-ET corresponde a qué vigencia
  detalle: El presupuesto se carga sin poder atribuirse a un año fiscal.
  impacto: MEDIO
  documento_id: ANEXO1_PIC
  ubicacion: Tabla 14
  estado: VERIFICADO
  verificacion: >-
    SELECT presupuesto_id, rubro_id, monto FROM presupuesto_rubro
    WHERE ciclo_id = 'PIC_ET_2026'

# ---------------------------------------------------------------- ANOMALÍA (1)

- hallazgo_id: A1
  clase: ANOMALIA
  titulo: Los compromisos de 2025 y 2026 son distribuciones idénticas
  detalle: >-
    Las Tablas 10 y 12 reparten 200 cupos entre las nueve sedes exactamente
    igual. Puede ser deliberado o un copiado; el corpus no lo dice.
  impacto: MEDIO
  documento_id: ANEXO1_PIC
  ubicacion: Tabla 10 / Tabla 12
  estado: VERIFICADO
  verificacion: >-
    SELECT unidad_id,
           max(CASE WHEN ciclo_id='PIC_CO_2025' THEN CAST(valor AS INT) END) AS c2025,
           max(CASE WHEN ciclo_id='PIC_CO_2026' THEN CAST(valor AS INT) END) AS c2026
    FROM declaracion WHERE medida_id='compromiso' AND unidad_id <> 'UNAL_TOTAL'
    GROUP BY unidad_id ORDER BY unidad_id
