# The inconsistency register, as data.
#
# §7.1 of pic-data-model-v2.md holds 38 items as prose, which cannot be queried
# or charted. Here they are rows.
#
# `estado` is the honest column. VERIFICADO means the loaded data demonstrates
# the finding and `verificacion` holds a query that proves it — run it and see.
# The rest wait on documents Phase 1 has not parsed, and the dashboard must say
# so rather than imply the pipeline found all 38.

