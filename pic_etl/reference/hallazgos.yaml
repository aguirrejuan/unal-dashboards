  detalle: >-
    Formulación, revisión, convocatoria, vinculación y matrícula: el corpus no
    documenta ninguna. La tabla proyecto_etapa está vacía.
  impacto: ALTO
  estado: VERIFICADO
  verificacion: >-
    SELECT e.etapa_id, e.nombre, count(pe.proyecto_id) AS eventos
    FROM etapa e LEFT JOIN proyecto_etapa pe ON pe.etapa_id = e.etapa_id
    GROUP BY e.etapa_id ORDER BY e.orden

- hallazgo_id: V7
  clase: VACIO
  titulo: Dos generaciones de rubros sin puente entre ellas
  detalle: >-
    Y una tercera sin puentear, «Área del Conocimiento», con 8 categorías
    heredadas frente a 11 ISCED. rubro_mapping está vacío a propósito: sin
    puente, una consulta entre generaciones no devuelve nada, que es la
    respuesta correcta.
  impacto: ALTO
  estado: VERIFICADO
  verificacion: >-
    SELECT generacion, count(*) AS rubros FROM rubro GROUP BY generacion

- hallazgo_id: V8
  clase: VACIO
  titulo: La Tabla 14 nunca dice qué línea PIC-ET corresponde a qué vigencia
  detalle: El presupuesto se carga sin poder atribuirse a un año fiscal.
  impacto: MEDIO
  documento_id: ANEXO1_PIC
  ubicacion: Tabla 14
  estado: VERIFICADO
  verificacion: >-
    SELECT presupuesto_id, rubro_id, monto FROM presupuesto_rubro
    WHERE ciclo_id = 'PIC_ET_2026'

- hallazgo_id: E18
  clase: ERROR
  titulo: El mismo programa vale un peso distinto en dos acuerdos
  detalle: >-
    El Acuerdo 005/2024 asigna $11.386.578.188 al PIC de Palmira, Manizales y
    Bogotá. El Acuerdo 006/2024, cuatro meses después, reparte ese mismo
    programa entre las tres sedes y sus cifras suman $11.386.578.187. Un peso
    de diferencia entre dos actos del mismo consejo. No estaba en el registro:
    aparece al cargar ambos acuerdos y comparar.
  impacto: BAJO
  documento_id: ACU_CSU_006_2024
  ubicacion: p.2
  estado: VERIFICADO
  verificacion: >-
    SELECT 'Acuerdo 005' AS acuerdo, CAST(monto AS REAL) AS valor
    FROM asignacion WHERE documento_id='ACU_CSU_005_2024' AND fuente_id='PIC_AMPLIACION'
    UNION ALL
    SELECT 'Acuerdo 006 (suma de sedes)', sum(CAST(monto AS REAL))
    FROM asignacion WHERE documento_id='ACU_CSU_006_2024'

- hallazgo_id: C6
  clase: COLISION
  titulo: «Rezago» significa lo contrario en cada documento
  detalle: >-
    El Anexo 1 titula su columna «Rezago (Compromiso-matriculados)»: positivo es
    déficit, y Bogotá aparece con −38 por haber superado su compromiso. El
    informe titula la suya «Rezago / cumplimiento» y calcula matriculados menos
    compromiso: negativo es déficit, y Bogotá aparece con +154. Misma palabra,
    signo invertido. Tratarlas como una sola medida invierte el resultado de
    todas las sedes, así que se cargan como medidas distintas.
  impacto: ALTO
  documento_id: INFORME_MEN_2024_2025
  ubicacion: Tabla 2 / §6
  estado: VERIFICADO
  verificacion: >-
    SELECT medida_id, unidad_id, CAST(valor AS INT) AS valor, documento_id
    FROM declaracion WHERE medida_id IN ('rezago','balance_cumplimiento')
    AND unidad_id IN ('BOGOTA','AMAZONIA') ORDER BY unidad_id, medida_id

- hallazgo_id: V9
  clase: VACIO
  titulo: La Orden 422447 nombra el PIC pero no aporta ninguna cifra
  detalle: >-
    v1 la excluyó por no guardar relación; v2 corrigió señalando que su página 3
    cita el PIC por su nombre. Ambas cosas son ciertas y la corrección se queda
    corta: es una solicitud de cambio de supervisor de la OFS 97 de 2025, un
    contrato de servicios profesionales por $67.500.000 ajeno al programa, y el
    PIC aparece una sola vez, como una de cuatro fuentes de memoria institucional
    («Proyecto 609, PIC, PLEI 2034, PGD») dentro del informe de actividades del
    contratista. Está en el corpus y no produce ningún hecho del PIC.
  impacto: BAJO
  documento_id: ORDEN_422447
  ubicacion: p.3, obligación 1.1
  estado: VERIFICADO
  verificacion: >-
    SELECT d.documento_id, d.soporte, count(p.ubicacion) AS cifras
    FROM documento d LEFT JOIN v_procedencia p ON p.documento_id = d.documento_id
    WHERE d.documento_id = 'ORDEN_422447' GROUP BY d.documento_id

# ---------------------------------------------------------------- ANOMALÍA (1)

- hallazgo_id: A1
  clase: ANOMALIA
  titulo: Los compromisos de 2025 y 2026 son distribuciones idénticas
  detalle: >-
    Las Tablas 10 y 12 reparten 200 cupos entre las nueve sedes exactamente
    igual. Puede ser deliberado o un copiado; el corpus no lo dice.
  impacto: MEDIO
  documento_id: ANEXO1_PIC
  ubicacion: Tabla 10 / Tabla 12
  estado: VERIFICADO
  verificacion: >-
    SELECT unidad_id,
           max(CASE WHEN ciclo_id='PIC_CO_2025' THEN CAST(valor AS INT) END) AS c2025,
           max(CASE WHEN ciclo_id='PIC_CO_2026' THEN CAST(valor AS INT) END) AS c2026
    FROM declaracion WHERE medida_id='compromiso' AND unidad_id <> 'UNAL_TOTAL'
    GROUP BY unidad_id ORDER BY unidad_id
