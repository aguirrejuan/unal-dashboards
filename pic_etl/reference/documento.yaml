# The document register.
#
# `estado` separates what the corpus holds from what it merely mentions, and I6
# enforces the difference: a held document has a path and a soporte, a cited one
# has neither. That turns "which held figures depend on a document nobody has?"
# into a query rather than a footnote.
#
# The five MEN resolutions are ESCANEO, not TRANSCRITO. §10 records them as
# transcribed, but that transcription is not in this repository, and claiming a
# soporte the repository cannot show would be exactly the kind of unsupported
# assertion this schema exists to prevent. They become TRANSCRITO when
# extractions/ holds their text.

