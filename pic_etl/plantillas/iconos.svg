<!-- Iconografía institucional, construida según la Guía Web B5 de la Universidad
     Nacional (https://identidad.unal.edu.co/guia-web/b-directrices-y-especificaciones/b5-iconografia/):

       · retícula de 32 × 32 píxeles
       · sólo líneas, sin rellenos
       · trazo de 1 píxel
       · composición asimétrica: el elemento más representativo carga hacia un lado

     El conjunto oficial vive en plantillasweb.unal.edu.co y no fue alcanzable
     desde aquí, así que estos se construyeron sobre la retícula en lugar de
     copiarse. La guía pide que todo ícono nuevo se envíe a la Oficina de Medios
     Digitales para su aprobación antes de sumarse a la colección.

     La guía especifica líneas blancas, porque en las plantillas de la
     Universidad los íconos se asientan sobre el verde institucional. Aquí van
     sobre panel blanco, así que heredan el color del texto; la construcción no
     cambia. `vector-effect="non-scaling-stroke"` mantiene el trazo en 1 píxel
     exacto a cualquier tamaño, que es lo que la retícula pide. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
 <symbol id="ico-panorama" viewBox="0 0 32 32"><g fill="none" stroke="currentColor"
   stroke-width="1" vector-effect="non-scaling-stroke">
   <path d="M4 27h24"/><path d="M4 27V5"/>
   <rect x="7" y="17" width="4" height="10"/>
   <rect x="13" y="11" width="4" height="16"/>
   <rect x="19" y="20" width="4" height="7"/>
   <rect x="25" y="8" width="4" height="19"/></g></symbol>

