   <rect x="22" y="4" width="8" height="7"/>
   <rect x="22" y="21" width="8" height="7"/>
   <path d="M10 16h6V7.5h5"/><path d="M16 16v8.5h5"/>
   <path d="m19 5.5 2.5 2-2.5 2z" fill="currentColor" stroke="none"/>
   <path d="m19 22.5 2.5 2-2.5 2z" fill="currentColor" stroke="none"/></g></symbol>

